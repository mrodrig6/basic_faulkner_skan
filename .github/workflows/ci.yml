name: CI
run-name: CI (${{ github.event_name }}) on ${{ github.ref_name }}

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, spelling, docs, four simulation tests and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development and documentation dependencies
        run: python -m pip install -e '.[dev,docs]'
      - name: Lint Python
        run: python -m ruff check .
      - name: Check spelling
        run: codespell
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Test Blasius, mild wedge, continuation and 11-case sweep
        run: python -m pytest -v tests/test_ci_smoke.py --junitxml=smoke-results.xml
      - name: Benchmark single solve and small sweep (no speed gate)
        run: python tools/check_simulations.py --benchmark-only
      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-smoke-test-results
          path: smoke-results.xml
          if-no-files-found: ignore
