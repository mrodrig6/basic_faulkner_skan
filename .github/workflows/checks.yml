name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development and documentation tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Lint Python
        run: python -m ruff check .
      - name: Check spelling
        run: codespell
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Small numerical checks and warmed benchmark
        run: python tools/check_simulations.py
