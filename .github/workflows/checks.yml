name: Lightweight CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, spelling, docs, numerical tests and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development and documentation tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Lint Python
        run: python -m ruff check .
      - name: Check spelling
        run: codespell
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
      - name: Test Blasius reference wall shear
        run: python tools/check_simulations.py --check blasius
      - name: Test mild-wedge physical profile
        run: python tools/check_simulations.py --check wedge
      - name: Test continuation to n=0.2
        run: python tools/check_simulations.py --check continuation
      - name: Test 11-case wall-shear sweep
        run: python tools/check_simulations.py --check sweep
      - name: Benchmark single solve and small sweep (informational)
        run: python tools/check_simulations.py --benchmark-only
